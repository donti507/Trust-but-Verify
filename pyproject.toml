[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustswap"
version = "0.0.1"
requires-python = ">=3.11"
description = "Verification and cost-aware abstention for AI-extracted swap terms"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.setuptools.package-data]
"trustswap.ref" = ["*.txt"]
