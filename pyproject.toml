[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustswap"
version = "0.0.1"
requires-python = ">=3.11"
description = "Verification and cost-aware abstention for AI-extracted swap terms"

[project.optional-dependencies]
desk = ["Flask>=3.1,<4", "bcrypt>=4,<6", "defusedxml>=0.7,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["browser: optional offline browser tests"]

[tool.setuptools.package-data]
"trustswap.ref" = ["*.txt", "*.yaml"]
"trustswap.synth.templates" = ["*.j2"]
"trustswap.extract" = ["prompts/*.txt", "prompts/*.json"]

"trustswap.desk" = ["templates/*.html"]
