# Extraction models (Step 10). Pin name, version and access_date before any run;
# the runner refuses PIN-ME values. Credentials live only in environment variables.
#
# Both tracks use the OpenAI-compatible chat API:
#   frontier      - OpenAI, Gemini (base URL https://generativelanguage.googleapis.com/v1beta/openai/)
#                   or Vertex AI's OpenAI-compatible endpoint. Public and synthetic documents only.
#                   Turn on zero data retention in the provider account; for OpenAI also send store=false.
#   open_weights  - vLLM server (e.g. on Kaggle): vllm serve Qwen/Qwen2.5-7B-Instruct-AWQ
#                   then set OPEN_WEIGHTS_BASE_URL=http://<host>:8000/v1 and OPEN_WEIGHTS_API_KEY=<any>.
models:
  frontier:
    name: "DeepSeek-V4.1-Flash"
    version: "deepseek-ai/DeepSeek-V4.1-Flash-1017"
    access_date: "2026-11-24"
    base_url_env: FRONTIER_BASE_URL   # unset -> provider default (OpenAI)
    api_key_env: FRONTIER_API_KEY
    structured: "json_schema"
    logprobs: true
    max_tokens: 4096
    send_seed: true
    extra_body: {}               # OpenAI: {store: false}
  open_weights:
    name: "Qwen/Qwen2.5-7B-Instruct-AWQ"
    version: "Qwen/Qwen2.5-7B-Instruct-AWQ@b25037543e9394b818fdfca67ab2a00ecc7dd641"
    access_date: "2026-11-24"
    base_url_env: OPEN_WEIGHTS_BASE_URL
    api_key_env: OPEN_WEIGHTS_API_KEY
    structured: "json_schema"
    logprobs: true
    max_tokens: 4096
    extra_body: {}
    send_seed: true
