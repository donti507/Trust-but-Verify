<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf() }}">
<title>{% block title %}Annotation{% endblock %} · Trust but Verify</title>
<link rel="stylesheet" href="{{ url_for('static', filename='annotation.css') }}">
{% block scripts %}{% endblock %}
</head>
<body>
<header class="bar">
<a class="brand" href="{{ url_for('queue') }}">Trust but Verify</a>
<span class="tag">Local annotation</span>
{% if g.user %}
<nav aria-label="Annotation navigation"><a href="{{ url_for('queue') }}">Queue</a><a href="{{ url_for('statistics') }}">Stats</a></nav>
<span>{{ g.user.id }} · {{ g.user.role }}</span>
<form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf() }}">
<button class="secondary">Sign out</button></form>
{% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
