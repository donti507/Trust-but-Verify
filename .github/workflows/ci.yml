name: CI
on: [push, pull_request]
env:
  PYTHONHASHSEED: "0"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF rendering and OCR system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core tesseract-ocr
      - run: pip install -r requirements-dev.txt && pip install -e .
      - run: pytest -q
