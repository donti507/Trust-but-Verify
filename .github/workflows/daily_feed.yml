name: Daily synthetic rates feed
on:
  workflow_dispatch:
    inputs:
      date:
        description: Optional publication date (YYYY-MM-DD UTC)
        type: string
concurrency:
  group: daily-feed-publication
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PCSS_BASE_URL: ${{ secrets.PCSS_BASE_URL }}
      PCSS_API_KEY: ${{ secrets.PCSS_API_KEY }}
      PUBLICATION_DATE: ${{ inputs.date || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.FEED_PUBLISH_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore feed cache and budget ledger
        uses: actions/cache/restore@v4
        with:
          path: cache/live_feed
          key: live-feed-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: live-feed-v1-
      - name: Install feed requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
          pip install -r requirements-dev.txt -e .
      - name: Run feed publisher
        run: |
          git config user.name "Trust but Verify feed"
          git config user.email "feed@users.noreply.github.com"
          if [[ -n "$PUBLICATION_DATE" ]]; then
            scripts/publish_feed_local.sh --date "$PUBLICATION_DATE"
          else
            scripts/publish_feed_local.sh
          fi
      - name: Save feed cache and budget ledger
        if: always() && hashFiles('cache/live_feed/budget/*.txt') != ''
        uses: actions/cache/save@v4
        with:
          path: cache/live_feed
          key: live-feed-v1-${{ github.run_id }}-${{ github.run_attempt }}
